                      code: "RND"
                      parent_id: null
                      path: "/1"
                      is_active: true
                    - id: 2
                      name: "产品部"
                      code: "PROD"
                      parent_id: null
                      path: "/2"
                      is_active: true
                tree_example:
                  value:
                    items:
                      - id: 1
                        name: "研究院"
                        code: "RND"
                        parent_id: null
                        path: "/1"
                        is_active: true
                        children:
                          - id: 11
                            name: "平台组"
                            code: "RND-PLATFORM"
                            parent_id: 1
                            path: "/1/11"
                            is_active: true
                            children: []
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /departments/paged:
    get:
      tags: [Users]
      summary: List departments (paged; for admin maintenance pages)
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/order'
        - name: q
          in: query
          schema: { type: string }
        - name: is_active
          in: query
          schema: { type: boolean }
        - name: parent_id
          in: query
          schema: { type: integer, format: int64, nullable: true }
      responses:
        '200':
          description: Paged departments
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedDepartment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: SESSION

  parameters:
    idPath:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

    page:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    pageSize:
      name: page_size
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 200 }
    sort:
      name: sort
      in: query
      schema: { type: string, default: "created_at" }
    order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc

    timeFrom:
      name: from
      in: query
      schema: { type: string, format: date-time }
    timeTo:
      name: to
      in: query
      schema: { type: string, format: date-time }

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            example:
              value:
                code: "BAD_REQUEST"
                message: "Invalid parameter"
                details: { field: "model_type" }
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            example:
              value: { code: "UNAUTHORIZED", message: "Login required" }
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            example:
              value: { code: "FORBIDDEN", message: "Insufficient permission" }
    NotFound:
      description: Not Found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            example:
              value: { code: "NOT_FOUND", message: "Resource not found" }
    Conflict:
      description: Conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            example:
              value: { code: "CONFLICT", message: "Name already exists" }

  schemas:
    # -------------------------
    # Common
    # -------------------------
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: object
          additionalProperties: true

    OwnerType:
      type: string
      enum: [USER, APP]

    ModelType:
      type: string
      enum: [CHAT, EMBEDDING, RERANK, VL, OCR]

    PolicyType:
      type: string
      enum: [COST_FIRST, QUALITY_FIRST, LATENCY_FIRST]

    ValidationIssue:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        field: { type: string }

    # -------------------------
    # Dashboard
    # -------------------------
    DashboardSummary:
      type: object
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        requests: { type: integer }
        success_rate: { type: number }
        p95_latency_ms: { type: integer }
        total_tokens: { type: integer }
        total_cost_cny: { type: number }

    # -------------------------
    # Models
    # -------------------------
    Model:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        vendor: { type: string }
        model_type: { $ref: '#/components/schemas/ModelType' }
        vendor_model_id: { type: string }
        enabled: { type: boolean }
        currency: { type: string, default: "CNY" }
        input_price: { type: number }
        output_price: { type: number }
        max_context: { type: integer, nullable: true }
        timeout_ms: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ModelCreateRequest:
      type: object
      required: [name, vendor, model_type, vendor_model_id]
      properties:
        name: { type: string }
        vendor: { type: string }
        model_type: { $ref: '#/components/schemas/ModelType' }
        vendor_model_id: { type: string }
        enabled: { type: boolean, default: true }
        currency: { type: string, default: "CNY" }
        input_price: { type: number, default: 0 }
        output_price: { type: number, default: 0 }
        max_context: { type: integer, nullable: true }
        timeout_ms: { type: integer, default: 60000 }

    ModelUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/ModelCreateRequest'

    ModelCredentialUpsertRequest:
      type: object
      required: [credential_type, payload]
      properties:
        credential_type:
          type: string
          enum: [API_KEY, AKSK, OAUTH, CUSTOM]
        payload:
          type: object
          additionalProperties: true

    PagedModel:
      type: object
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/Model' }

    # -------------------------
    # Routing
    # -------------------------
    RoutingPolicy:
      type: object
      properties:
        id: { type: integer, format: int64 }
        dept_id: { type: integer, format: int64 }
        model_type: { $ref: '#/components/schemas/ModelType' }
        policy_type: { $ref: '#/components/schemas/PolicyType' }
        enabled: { type: boolean }
        model_chain:
          type: array
          items: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time }

    RoutingPolicyUpsertRequest:
      type: object
      required: [dept_id, model_type, policy_type, model_chain]
      properties:
        dept_id: { type: integer, format: int64 }
        model_type: { $ref: '#/components/schemas/ModelType' }
        policy_type: { $ref: '#/components/schemas/PolicyType' }
        enabled: { type: boolean, default: true }
        model_chain:
          type: array
          minItems: 1
          items: { type: integer, format: int64 }

    # -------------------------
    # API Keys
    # -------------------------
    ApiKey:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        owner_type: { $ref: '#/components/schemas/OwnerType' }
        owner_id: { type: integer, format: int64 }
        dept_id: { type: integer, format: int64 }
        expires_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        scoped_model_ids:
          type: array
          items: { type: integer, format: int64 }
          nullable: true
        created_at: { type: string, format: date-time }

    ApiKeyCreateRequest:
      type: object
      required: [name, owner_type, owner_id, dept_id]
      properties:
        name: { type: string }
        owner_type: { $ref: '#/components/schemas/OwnerType' }
        owner_id: { type: integer, format: int64 }
        dept_id: { type: integer, format: int64 }
        expires_at: { type: string, format: date-time, nullable: true }
        scoped_model_ids:
          type: array
          items: { type: integer, format: int64 }
          nullable: true

    ApiKeyCreateResponse:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [api_key_plaintext]
          properties:
            api_key_plaintext:
              type: string
              description: Returned once; never returned again.

    ApiKeyPatchRequest:
      type: object
      properties:
        expires_at: { type: string, format: date-time, nullable: true }
        scoped_model_ids:
          type: array
          items: { type: integer, format: int64 }
          nullable: true

    PagedApiKey:
      type: object
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiKey' }

    # -------------------------
    # Users
    # -------------------------
    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        oidc_subject: { type: string }
        username: { type: string }
        display_name: { type: string, nullable: true }
        email: { type: string, nullable: true }
        dept_id: { type: integer, format: int64, nullable: true }
        is_active: { type: boolean }
        last_login_at: { type: string, format: date-time, nullable: true }

    UserPatchRequest:
      type: object
      properties:
        dept_id: { type: integer, format: int64, nullable: true }
        is_active: { type: boolean, nullable: true }

    PagedUser:
      type: object
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }

    # -------------------------
    # Apps
    # -------------------------
    App:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        owner_user_id: { type: integer, format: int64, nullable: true }
        dept_id: { type: integer, format: int64, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }

    AppCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        owner_user_id: { type: integer, format: int64, nullable: true }
        dept_id: { type: integer, format: int64, nullable: true }
        is_active: { type: boolean, default: true }

    AppPatchRequest:
      type: object
      properties:
        owner_user_id: { type: integer, format: int64, nullable: true }
        dept_id: { type: integer, format: int64, nullable: true }
        is_active: { type: boolean, nullable: true }

    PagedApp:
      type: object
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/App' }

    # -------------------------
    # Roles & Permissions
    # -------------------------
    Role:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        is_default: { type: boolean }

    RoleCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        is_default: { type: boolean, default: false }

    RolePatchRequest:
      type: object
      properties:
        name: { type: string, nullable: true }
        is_default: { type: boolean, nullable: true }

    Permission:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        description: { type: string, nullable: true }

    # -------------------------
    # Quotas
    # -------------------------
    Quota:
      type: object
      properties:
        id: { type: integer, format: int64 }
        scope_type: { type: string, enum: [USER, DEPT] }
        scope_id: { type: integer, format: int64 }
        month_yyyymm: { type: string }
        token_cap: { type: integer, format: int64 }
        token_used: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time }

    QuotaUpsertRequest:
      type: object
      required: [scope_type, scope_id, month_yyyymm, token_cap]
      properties:
        scope_type: { type: string, enum: [USER, DEPT] }
        scope_id: { type: integer, format: int64 }
        month_yyyymm: { type: string, pattern: '^\d{6}$' }
        token_cap: { type: integer, format: int64, minimum: 0 }

    PagedQuota:
      type: object
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/Quota' }

    # -------------------------
    # Security Governance
    # -------------------------
    SensitiveWord:
      type: object
      properties:
        id: { type: integer, format: int64 }
        phrase: { type: string }
        model_type: { $ref: '#/components/schemas/ModelType' }
        severity: { type: string, enum: [LOW, MEDIUM, HIGH] }
        action: { type: string, enum: [WARN, BLOCK] }
        scope_type: { type: string, enum: [GLOBAL, DEPT, USER] }
        scope_id: { type: integer, format: int64, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SensitiveWordUpsertRequest:
      type: object
      required: [phrase, model_type, severity, action, scope_type]
      properties:
        phrase: { type: string }
        model_type: { $ref: '#/components/schemas/ModelType' }
        severity: { type: string, enum: [LOW, MEDIUM, HIGH] }
        action: { type: string, enum: [WARN, BLOCK] }
        scope_type: { type: string, enum: [GLOBAL, DEPT, USER] }
        scope_id: { type: integer, format: int64, nullable: true }
        is_active: { type: boolean, default: true }

    PagedSensitiveWord:
      type: object
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/SensitiveWord' }

    AccessListEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        list_type: { type: string, enum: [ALLOW, BLOCK] }
        subject_type: { type: string, enum: [USER, DEPT, APP, IP] }
        subject_id: { type: integer, format: int64, nullable: true }
        subject_value: { type: string, nullable: true, description: e.g. IP/CIDR }
        reason: { type: string, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AccessListEntryUpsertRequest:
      type: object
      required: [list_type, subject_type]
      properties:
        list_type: { type: string, enum: [ALLOW, BLOCK] }
        subject_type: { type: string, enum: [USER, DEPT, APP, IP] }
        subject_id: { type: integer, format: int64, nullable: true }
        subject_value: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        is_active: { type: boolean, default: true }

    PagedAccessListEntry:
      type: object
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/AccessListEntry' }

    PromptInjectionPolicy:
      type: object
      properties:
        mode: { type: string, enum: [OFF, DETECT, BLOCK] }
        score_threshold: { type: number }
        content_safety_enabled: { type: boolean }
        sensitive_word_enabled: { type: boolean }
        allowlist_enabled: { type: boolean }
        blocklist_enabled: { type: boolean }
        max_risk_level: { type: string, enum: [LOW, MEDIUM, HIGH] }
        updated_at: { type: string, format: date-time }

    PromptInjectionPolicyUpdateRequest:
      type: object
      properties:
        mode: { type: string, enum: [OFF, DETECT, BLOCK] }
        score_threshold: { type: number, minimum: 0, maximum: 1 }
        content_safety_enabled: { type: boolean }
        sensitive_word_enabled: { type: boolean }
        allowlist_enabled: { type: boolean }
        blocklist_enabled: { type: boolean }
        max_risk_level: { type: string, enum: [LOW, MEDIUM, HIGH] }

    SecurityIncident:
      type: object
      properties:
        id: { type: integer, format: int64 }
        timestamp: { type: string, format: date-time }
        request_id: { type: string, nullable: true }
        rule_type: { type: string, enum: [SENSITIVE_WORD, PROMPT_INJECTION, ACCESS_LIST] }
        rule_id: { type: string, nullable: true }
        severity: { type: string, enum: [LOW, MEDIUM, HIGH] }
        action: { type: string, enum: [ALLOW, WARN, BLOCK] }
        model_type: { $ref: '#/components/schemas/ModelType' }
        model_id: { type: integer, format: int64, nullable: true }
        dept_id: { type: integer, format: int64, nullable: true }
        user_id: { type: integer, format: int64, nullable: true }
        detail_json:
          type: object
          additionalProperties: true
          nullable: true

    PagedSecurityIncident:
      type: object
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/SecurityIncident' }

    # -------------------------
    # Reports
    # -------------------------
    UsageAggRow:
      type: object
      properties:
        key: { type: string }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        user_id: { type: integer, format: int64, nullable: true }
        dept_id: { type: integer, format: int64, nullable: true }
        model_id: { type: integer, format: int64, nullable: true }
        vendor: { type: string, nullable: true }
        requests: { type: integer }
        success_rate: { type: number }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        total_tokens: { type: integer }
        p95_latency_ms: { type: integer, nullable: true }

    CostAggRow:
      type: object
      properties:
        key: { type: string }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        user_id: { type: integer, format: int64, nullable: true }
        dept_id: { type: integer, format: int64, nullable: true }
        model_id: { type: integer, format: int64, nullable: true }
        vendor: { type: string, nullable: true }
        total_cost_cny: { type: number }
        total_tokens: { type: integer }
        requests: { type: integer, nullable: true }

    SecurityAggRow:
      type: object
      properties:
        key: { type: string }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        incident_count: { type: integer }
        blocked_count: { type: integer }
        warned_count: { type: integer }

    # -------------------------
    # Logs
    # -------------------------
    LogHit:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        request_id: { type: string }
        base_path: { type: string, enum: [OPENAI, CLAUDE] }
        endpoint: { type: string }
        status: { type: string, enum: [SUCCESS, FAILED] }
        error_code: { type: string, nullable: true }
        dept_id: { type: integer, format: int64 }
        subject_type: { $ref: '#/components/schemas/OwnerType' }
        subject_id: { type: integer, format: int64 }
        vendor: { type: string }
        model_id: { type: integer, format: int64 }
        model_type: { $ref: '#/components/schemas/ModelType' }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        total_tokens: { type: integer }
        cost_cny: { type: number }
        latency_ms: { type: integer }
        job_id: { type: string, nullable: true }

    PagedLogHit:
      type: object
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/LogHit' }

    LogDetail:
      allOf:
        - $ref: '#/components/schemas/LogHit'
        - type: object
          properties:
            routing_policy: { type: string, nullable: true }
            fallback_used: { type: boolean, nullable: true }
            raw_prompt:
              description: Present only if ES raw enabled AND user has permission
              nullable: true
              oneOf:
                - type: string
                - type: object
                  additionalProperties: true
            raw_response:
              description: Present only if ES raw enabled AND user has permission
              nullable: true
              oneOf:
                - type: string
                - type: object
                  additionalProperties: true

    # -------------------------
    # Jobs
    # -------------------------
    Job:
      type: object
      properties:
        job_id: { type: string }
        job_type: { type: string, enum: [CHAT, EMBEDDING, RERANK, VL, OCR, EMBEDDING_BATCH] }
        status: { type: string, enum: [PENDING, RUNNING, SUCCEEDED, FAILED, CANCELED] }
        attempt: { type: integer }
        max_attempts: { type: integer }
        owner_type: { $ref: '#/components/schemas/OwnerType' }
        owner_id: { type: integer, format: int64 }
        dept_id: { type: integer, format: int64 }
        requested_model_id: { type: integer, format: int64, nullable: true }
        model_type: { $ref: '#/components/schemas/ModelType' }
        file_ids:
          type: array
          items: { type: integer, format: int64 }
          nullable: true
        input_json:
          type: object
          additionalProperties: true
          nullable: true
        result_json:
          type: object
          additionalProperties: true
          nullable: true
        error_code: { type: string, nullable: true }
        error_message: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PagedJob:
      type: object
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/Job' }

    # -------------------------
    # Audit
    # -------------------------
    AuditLog:
      type: object
      properties:
        id: { type: integer, format: int64 }
        actor_user_id: { type: integer, format: int64 }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string, nullable: true }
        detail_json:
          type: object
          additionalProperties: true
          nullable: true
        created_at: { type: string, format: date-time }

    PagedAuditLog:
      type: object
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditLog' }

    # -------------------------
    # Settings
    # -------------------------
    LoggingSettings:
      type: object
      properties:
        es_enabled: { type: boolean }
        es_endpoint: { type: string }
        index_prefix: { type: string }
        raw_enabled: { type: boolean }
        desensitize_enabled: { type: boolean }
        extra_regex:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              pattern: { type: string }
              replacement: { type: string }

    LoggingSettingsUpdateRequest:
      type: object
      properties:
        raw_enabled: { type: boolean, nullable: true }
        desensitize_enabled: { type: boolean, nullable: true }
        extra_regex:
          type: array
          items:
            type: object
            required: [name, pattern, replacement]
            properties:
              name: { type: string }
              pattern: { type: string }
              replacement: { type: string }

    SystemSettings:
      type: object
      properties:
        default_policy_type: { $ref: '#/components/schemas/PolicyType' }
        upload_max_file_size_bytes: { type: integer, format: int64 }
        upload_allowed_content_types:
          type: array
          items: { type: string }
        vendor_connect_timeout_ms: { type: integer }
        vendor_read_timeout_ms: { type: integer }

    SystemSettingsUpdateRequest:
      type: object
      properties:
        default_policy_type: { $ref: '#/components/schemas/PolicyType' }
        upload_max_file_size_bytes: { type: integer, format: int64 }
        upload_allowed_content_types:
          type: array
          items: { type: string }
        vendor_connect_timeout_ms: { type: integer }
        vendor_read_timeout_ms: { type: integer }

    OidcSettings:
      type: object
      properties:
        issuer: { type: string }
        client_id: { type: string }
        login_enabled: { type: boolean }
        groups_claim_present: { type: boolean }
        org_sync_enabled:
          type: boolean
          description: Always false in v1.
        last_login_at: { type: string, format: date-time, nullable: true }

    Department:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        code: { type: string, nullable: true }
        parent_id: { type: integer, format: int64, nullable: true }
        path:
          type: string
          nullable: true
          description: "materialized path for quick tree building, e.g., /1/11"
        is_active: { type: boolean, default: true }

    DepartmentTreeNode:
      allOf:
        - $ref: '#/components/schemas/Department'
        - type: object
          properties:
            children:
              type: array
              items: { $ref: '#/components/schemas/DepartmentTreeNode' }

    DepartmentTreeResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DepartmentTreeNode' }

    PagedDepartment:
      type: object
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/Department' }

    MeResponse:
      type: object
      required: [user, permission_codes]
      properties:
        user: { $ref: '#/components/schemas/User' }
        dept:
          $ref: '#/components/schemas/Department'
          nullable: true
        role_names:
          type: array
          items: { type: string }
          description: human readable role names for UI display
        permission_codes:
          type: array
          items: { type: string }
          description: permission codes for menu/button rendering
