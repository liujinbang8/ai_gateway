openapi: 3.0.3
info:
  title: LLM Gateway - Admin API
  version: 1.1.0
servers:
  - url: /admin
security:
  - cookieAuth: []
tags:
  - name: Dashboard
  - name: Models
  - name: Routing
  - name: ApiKeys
  - name: Users
  - name: Apps
  - name: Roles
  - name: Permissions
  - name: Quotas
  - name: Reports
  - name: Logs
  - name: Jobs
  - name: Audit
  - name: Settings
  - name: Security

paths:
  # -------------------------
  # Dashboard
  # -------------------------
  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Dashboard summary metrics
      parameters:
        - $ref: '#/components/parameters/timeFrom'
        - $ref: '#/components/parameters/timeTo'
      responses:
        '200':
          description: Summary cards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
              examples:
                example:
                  value:
                    from: "2026-02-12T00:00:00Z"
                    to: "2026-02-13T00:00:00Z"
                    requests: 12345
                    success_rate: 0.992
                    p95_latency_ms: 1800
                    total_tokens: 9876543
                    total_cost_cny: 1234.56
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # -------------------------
  # Models
  # -------------------------
  /models:
    get:
      tags: [Models]
      summary: List models
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/order'
        - name: q
          in: query
          schema: { type: string }
          description: search by name/vendor/vendor_model_id
        - name: vendor
          in: query
          schema: { type: string }
        - name: model_type
          in: query
          schema: { $ref: '#/components/schemas/ModelType' }
        - name: enabled
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Paged model list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedModel' }
              examples:
                example:
                  value:
                    page: 1
                    page_size: 20
                    total: 2
                    items:
                      - id: 12
                        name: "gpt-4o-mini"
                        vendor: "openai"
                        model_type: "CHAT"
                        vendor_model_id: "gpt-4o-mini"
                        enabled: true
                        currency: "CNY"
                        input_price: 0.10
                        output_price: 0.30
                        timeout_ms: 60000
                        updated_at: "2026-02-13T00:00:00Z"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Models]
      summary: Create model
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelCreateRequest' }
            examples:
              example:
                value:
                  name: "gpt-4o-mini"
                  vendor: "openai"
                  model_type: "CHAT"
                  vendor_model_id: "gpt-4o-mini"
                  enabled: true
                  currency: "CNY"
                  input_price: 0.10
                  output_price: 0.30
                  timeout_ms: 60000
      responses:
        '201':
          description: Created model
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Model' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /models/{id}:
    get:
      tags: [Models]
      summary: Get model by id
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200':
          description: Model detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Model' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Models]
      summary: Update model
      parameters:
        - $ref: '#/components/parameters/idPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelUpdateRequest' }
      responses:
        '200':
          description: Updated model
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Model' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Models]
      summary: Enable/Disable model
      parameters:
        - $ref: '#/components/parameters/idPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: Patched model
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Model' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /models/{id}/credential:
    put:
      tags: [Models]
      summary: Set/Update model credential (encrypted at rest)
      parameters:
        - $ref: '#/components/parameters/idPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelCredentialUpsertRequest' }
            examples:
              openai_api_key:
                value:
                  credential_type: "API_KEY"
                  payload:
                    api_key: "sk-xxxx"
              aksk:
                value:
                  credential_type: "AKSK"
                  payload:
                    access_key: "xxx"
                    secret_key: "yyy"
      responses:
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [Models]
      summary: Get credential status/fingerprint (never return plaintext)
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200':
          description: Credential status
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: { type: boolean }
                  credential_type: { type: string }
                  fingerprint: { type: string, description: "e.g., last4 or hash prefix" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # -------------------------
  # Routing Policies
  # -------------------------
  /routing/policies:
    get:
      tags: [Routing]
      summary: List routing policies
      parameters:
        - name: dept_id
          in: query
          schema: { type: integer, format: int64 }
        - name: model_type
          in: query
          schema: { $ref: '#/components/schemas/ModelType' }
        - name: policy_type
          in: query
          schema: { $ref: '#/components/schemas/PolicyType' }
      responses:
        '200':
          description: Policy list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoutingPolicy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /routing/policies/upsert:
    post:
      tags: [Routing]
      summary: Upsert a department routing policy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoutingPolicyUpsertRequest' }
            examples:
              example:
                value:
                  dept_id: 1
                  model_type: "CHAT"
                  policy_type: "COST_FIRST"
                  enabled: true
                  model_chain: [12, 7, 3]
      responses:
        '200':
          description: Upserted policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutingPolicy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /routing/policies/validate:
    post:
      tags: [Routing]
      summary: Validate routing policy chain (type/enabled/permission conflicts)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoutingPolicyUpsertRequest' }
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  warnings:
                    type: array
                    items: { $ref: '#/components/schemas/ValidationIssue' }
                  errors:
                    type: array
                    items: { $ref: '#/components/schemas/ValidationIssue' }
              examples:
                example:
                  value:
                    ok: false
                    warnings:
                      - code: "MODEL_DISABLED"
                        message: "Model 7 is disabled"
                        field: "model_chain"
                    errors:
                      - code: "MODEL_TYPE_MISMATCH"
                        message: "Model 21 is OCR but policy model_type is CHAT"
                        field: "model_chain"
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # -------------------------
  # API Keys
  # -------------------------
  /api-keys:
    get:
      tags: [ApiKeys]
      summary: List API keys
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/order'
        - name: owner_type
          in: query
          schema: { $ref: '#/components/schemas/OwnerType' }
        - name: owner_id
          in: query
          schema: { type: integer, format: int64 }
        - name: dept_id
          in: query
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, EXPIRED, REVOKED]
        - name: q
          in: query
          schema: { type: string }
          description: search by name
      responses:
        '200':
          description: Paged key list (never returns plaintext key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedApiKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [ApiKeys]
      summary: Create API key (plaintext returned once)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiKeyCreateRequest' }
            examples:
              app_key:
                value:
                  name: "crm-prod"
                  owner_type: "APP"
                  owner_id: 10
                  dept_id: 1
                  expires_at: "2026-12-31T00:00:00Z"
                  scoped_model_ids: [12, 7]
      responses:
        '201':
          description: Created key (plaintext only in this response)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyCreateResponse' }
              examples:
                example:
                  value:
                    id: 100
                    name: "crm-prod"
                    owner_type: "APP"
                    owner_id: 10
                    dept_id: 1
                    expires_at: "2026-12-31T00:00:00Z"
                    api_key_plaintext: "gw_live_xxxxx"
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api-keys/{id}:
    get:
      tags: [ApiKeys]
      summary: Get API key metadata
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200':
          description: Key metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [ApiKeys]
      summary: Update API key (expiry, scope)
      parameters:
        - $ref: '#/components/parameters/idPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiKeyPatchRequest' }
      responses:
        '200':
          description: Updated key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api-keys/{id}/revoke:
    post:
      tags: [ApiKeys]
      summary: Revoke API key
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '204':
          description: Revoked
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # -------------------------
  # Users / Apps
  # -------------------------
  /users:
    get:
      tags: [Users]
      summary: List users
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: dept_id
          in: query
          schema: { type: integer, format: int64 }
        - name: active
          in: query
          schema: { type: boolean }
        - name: q
          in: query
          schema: { type: string }
          description: search by username/display_name/email
      responses:
        '200':
          description: Paged users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/{id}:
    get:
      tags: [Users]
      summary: Get user
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200':
          description: User
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Users]
      summary: Update user status or department
      parameters:
        - $ref: '#/components/parameters/idPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPatchRequest' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /apps:
    get:
      tags: [Apps]
      summary: List apps
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: dept_id
          in: query
          schema: { type: integer, format: int64 }
        - name: active
          in: query
          schema: { type: boolean }
        - name: q
          in: query
          schema: { type: string }
          description: search by name
      responses:
        '200':
          description: Paged apps
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedApp' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Apps]
      summary: Create app
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppCreateRequest' }
      responses:
        '201':
          description: Created app
          content:
            application/json:
              schema: { $ref: '#/components/schemas/App' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /apps/{id}:
    get:
      tags: [Apps]
      summary: Get app
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200':
          description: App
          content:
            application/json:
              schema: { $ref: '#/components/schemas/App' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Apps]
      summary: Update app status/owner/department
      parameters:
        - $ref: '#/components/parameters/idPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppPatchRequest' }
      responses:
        '200':
          description: Updated app
          content:
            application/json:
              schema: { $ref: '#/components/schemas/App' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # -------------------------
  # Roles / Permissions / Role-Models
  # -------------------------
  /roles:
    get:
      tags: [Roles]
      summary: List roles
      responses:
        '200':
          description: Role list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Roles]
      summary: Create role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleCreateRequest' }
      responses:
        '201':
          description: Created role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /roles/{id}:
    get:
      tags: [Roles]
      summary: Get role
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200':
          description: Role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Roles]
      summary: Update role (name/default)
      parameters:
        - $ref: '#/components/parameters/idPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RolePatchRequest' }
      responses:
        '200':
          description: Updated role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /roles/{id}/permissions:
    put:
      tags: [Roles]
      summary: Set role permissions (replace)
      parameters:
        - $ref: '#/components/parameters/idPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission_codes]
              properties:
                permission_codes:
                  type: array
                  items: { type: string }
      responses:
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /permissions:
    get:
      tags: [Permissions]
      summary: List permissions
      responses:
        '200':
          description: Permission list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Permission' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /roles/{id}/models:
    put:
      tags: [Roles]
      summary: Set role model permissions (replace)
      parameters:
        - $ref: '#/components/parameters/idPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model_ids]
              properties:
                model_ids:
                  type: array
                  items: { type: integer, format: int64 }
      responses:
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /subjects/{subject_type}/{subject_id}/roles:
    put:
      tags: [Roles]
      summary: Set subject roles (replace)
      parameters:
        - name: subject_type
          in: path
          required: true
          schema: { $ref: '#/components/schemas/OwnerType' }
        - name: subject_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_ids]
              properties:
                role_ids:
                  type: array
                  items: { type: integer, format: int64 }
      responses:
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # -------------------------
  # Security Governance
  # -------------------------
  /security/sensitive-words:
    get:
      tags: [Security]
      summary: List sensitive words/rules
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: q
          in: query
          schema: { type: string }
        - name: model_type
          in: query
          schema: { $ref: '#/components/schemas/ModelType' }
        - name: severity
          in: query
          schema:
            type: string
            enum: [LOW, MEDIUM, HIGH]
        - name: action
          in: query
          schema:
            type: string
            enum: [WARN, BLOCK]
        - name: scope_type
          in: query
          schema:
            type: string
            enum: [GLOBAL, DEPT, USER]
        - name: active
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Paged sensitive words
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedSensitiveWord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Security]
      summary: Create sensitive word/rule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SensitiveWordUpsertRequest' }
      responses:
        '201':
          description: Created
          content:
