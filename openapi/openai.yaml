openapi: 3.0.3
info:
  title: LLM Gateway - OpenAI Compatible API
  version: 1.1.0
servers:
  - url: /openai/v1
security:
  - bearerAuth: []
paths:
  /chat/completions:
    post:
      summary: OpenAI-compatible chat completions (CHAT)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAIChatRequest'
            examples:
              basic:
                value:
                  model: "gpt-4o-mini"
                  messages:
                    - role: "user"
                      content: "Hello"
                  stream: false
      responses:
        '200':
          description: Chat completion response (stream=false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIChatResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '401':
          description: Invalid key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '403':
          description: Forbidden (model not allowed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '429':
          description: Quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
      description: |
        If stream=true, returns SSE with content-type text/event-stream.
        SSE format: `data: {json}\n\n` and ends with `data: [DONE]\n\n`.

  /responses:
    post:
      summary: OpenAI-compatible responses API (VL/Multimodal)
      description: |
        Gateway uses this endpoint as the standard VL synchronous contract.
        `input` may include text and image blocks.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAIResponsesRequest'
      responses:
        '200':
          description: Responses result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIResponsesResponse'
        '4XX':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'

  /embeddings:
    post:
      summary: OpenAI-compatible embeddings (EMBEDDING)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAIEmbeddingsRequest'
      responses:
        '200':
          description: Embeddings response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIEmbeddingsResponse'
        '4XX':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'

  /rerank:
    post:
      summary: OpenAI-compatible rerank (RERANK)
      description: Gateway extension with vendor-neutral rerank contract.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAIRerankRequest'
      responses:
        '200':
          description: Rerank response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIRerankResponse'
        '4XX':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'

  /models:
    get:
      summary: List available models (filtered by permission)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Models list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIModelsResponse'

  /ocr:
    post:
      summary: OCR (multipart upload) - gateway specific (OCR)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                model:
                  type: string
                  description: Optional. If omitted, gateway routes by policy.
                options:
                  type: string
                  description: Optional JSON string of OCR options.
      responses:
        '200':
          description: OCR result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcrResponse'
        '4XX':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'

  /jobs:
    post:
      summary: Create async job (CHAT/EMBEDDING/RERANK/VL/OCR)
      description: Unified async contract for all model types.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateRequest'
      responses:
        '200':
          description: Job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreateResponse'

  /jobs/{job_id}:
    get:
      summary: Get job status/result
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobGetResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    OpenAIChatRequest:
      type: object
      required: [messages]
      properties:
        model:
          type: string
          description: Requested model name (optional if routing enabled).
        messages:
          type: array
          items:
            $ref: '#/components/schemas/OpenAIMessage'
        temperature:
          type: number
        max_tokens:
          type: integer
        stream:
          type: boolean
          default: false
        metadata:
          type: object
          additionalProperties: true
      additionalProperties: true

    OpenAIMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: true
      additionalProperties: true

    OpenAIChatResponse:
      type: object
      properties:
        id: { type: string }
        object: { type: string }
        created: { type: integer }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            additionalProperties: true
        usage:
          $ref: '#/components/schemas/OpenAIUsage'
      additionalProperties: true

    OpenAIResponsesRequest:
      type: object
      required: [input]
      properties:
        model: { type: string }
        input:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: true
        stream: { type: boolean, default: false }
        modalities:
          type: array
          items: { type: string }
        metadata:
          type: object
          additionalProperties: true
      additionalProperties: true

    OpenAIResponsesResponse:
      type: object
      properties:
        id: { type: string }
        object: { type: string }
        model: { type: string }
        status: { type: string }
        output:
          type: array
          items:
            type: object
            additionalProperties: true
        usage:
          $ref: '#/components/schemas/OpenAIUsage'
      additionalProperties: true

    OpenAIUsage:
      type: object
      properties:
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        total_tokens: { type: integer }
      additionalProperties: true

    OpenAIEmbeddingsRequest:
      type: object
      required: [input]
      properties:
        model: { type: string }
        input:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
      additionalProperties: true

    OpenAIEmbeddingsResponse:
      type: object
      properties:
        object: { type: string }
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        model: { type: string }
        usage:
          $ref: '#/components/schemas/OpenAIUsage'
      additionalProperties: true

    OpenAIRerankRequest:
      type: object
      required: [input, documents]
      properties:
        model: { type: string }
        input: { type: string, description: "query text" }
        documents:
          type: array
          minItems: 1
          items:
            oneOf:
              - type: string
              - type: object
                additionalProperties: true
        top_n: { type: integer, minimum: 1 }
        return_documents: { type: boolean, default: false }
        metadata:
          type: object
          additionalProperties: true
      additionalProperties: true

    OpenAIRerankItem:
      type: object
      properties:
        index: { type: integer }
        relevance_score: { type: number }
        document:
          nullable: true
          oneOf:
            - type: string
            - type: object
              additionalProperties: true

    OpenAIRerankResponse:
      type: object
      properties:
        id: { type: string }
        model: { type: string }
        results:
          type: array
          items:
            $ref: '#/components/schemas/OpenAIRerankItem'
        usage:
          $ref: '#/components/schemas/OpenAIUsage'
      additionalProperties: true

    OpenAIModelsResponse:
      type: object
      properties:
        object: { type: string, default: "list" }
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              object: { type: string, default: "model" }
            additionalProperties: true
      additionalProperties: true

    OcrResponse:
      type: object
      properties:
        request_id: { type: string }
        file_id: { type: integer }
        text: { type: string }
        pages:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true

    JobCreateRequest:
      type: object
      required: [job_type]
      properties:
        job_type:
          type: string
          enum: [CHAT, EMBEDDING, RERANK, VL, OCR, EMBEDDING_BATCH]
        model:
          type: string
          description: Optional requested model; if omitted, routing applies.
        file_ids:
          type: array
          items: { type: integer }
        input:
          type: object
          additionalProperties: true
        callback_url:
          type: string
          format: uri
          nullable: true
        priority:
          type: string
          enum: [LOW, NORMAL, HIGH]
          default: NORMAL
        metadata:
          type: object
          additionalProperties: true
      additionalProperties: true

    JobCreateResponse:
      type: object
      properties:
        job_id: { type: string }
        status: { type: string }
      additionalProperties: true

    JobGetResponse:
      type: object
      properties:
        job_id: { type: string }
        job_type: { type: string }
        status: { type: string }
        result:
          type: object
          additionalProperties: true
        error_code: { type: string }
        error_message: { type: string }
      additionalProperties: true

    OpenAIError:
      type: object
      properties:
        error:
          type: object
          properties:
            message: { type: string }
            type: { type: string }
            code: { type: string }
          required: [message]
      required: [error]
