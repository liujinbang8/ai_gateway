openapi: 3.0.3
info:
  title: LLM Gateway - Claude (Anthropic) Compatible API
  version: 1.1.0
servers:
  - url: /claude/v1
security:
  - apiKeyAuth: []
paths:
  /messages:
    post:
      summary: Anthropic-compatible Messages API (CHAT/VL)
      description: |
        Standard synchronous endpoint for chat and multimodal VL.
        VL is represented by image/document blocks inside `messages[*].content`.
        If `stream=true`, response is SSE.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaudeMessagesRequest'
            examples:
              basic:
                value:
                  model: "claude-3-5-sonnet"
                  max_tokens: 256
                  messages:
                    - role: "user"
                      content: "Hello"
                  stream: false
              vl:
                value:
                  model: "claude-3-5-sonnet"
                  max_tokens: 512
                  messages:
                    - role: "user"
                      content:
                        - type: text
                          text: "Describe this image"
                        - type: image
                          source:
                            type: base64
                            media_type: image/png
                            data: "..."
      responses:
        '200':
          description: Messages response (stream=false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaudeMessagesResponse'
        '4XX':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaudeError'

  /embeddings:
    post:
      summary: Claude-compatible embeddings (gateway extension)
      description: Vendor-neutral embedding contract under Claude base path.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaudeEmbeddingsRequest'
      responses:
        '200':
          description: Embedding response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaudeEmbeddingsResponse'
        '4XX':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaudeError'

  /rerank:
    post:
      summary: Claude-compatible rerank (gateway extension)
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaudeRerankRequest'
      responses:
        '200':
          description: Rerank response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaudeRerankResponse'
        '4XX':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaudeError'

  /ocr:
    post:
      summary: OCR (multipart upload) - gateway extension
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                model:
                  type: string
                  description: Optional requested model.
                options:
                  type: string
                  description: Optional JSON string.
      responses:
        '200':
          description: OCR result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaudeOcrResponse'
        '4XX':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaudeError'

  /jobs:
    post:
      summary: Create async job (CHAT/EMBEDDING/RERANK/VL/OCR)
      description: Unified async contract for all model types.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateRequest'
      responses:
        '200':
          description: Job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreateResponse'

  /jobs/{job_id}:
    get:
      summary: Get job status/result
      security:
        - apiKeyAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobGetResponse'

components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key

  schemas:
    ClaudeMessagesRequest:
      type: object
      required: [messages, max_tokens]
      properties:
        model: { type: string }
        max_tokens: { type: integer }
        system:
          oneOf:
            - type: string
            - type: array
              items: { type: object, additionalProperties: true }
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ClaudeMessage'
        temperature: { type: number }
        stream: { type: boolean, default: false }
        metadata:
          type: object
          additionalProperties: true
      additionalProperties: true

    ClaudeMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          oneOf:
            - type: string
            - type: array
              items: { type: object, additionalProperties: true }
      additionalProperties: true

    ClaudeMessagesResponse:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        role: { type: string }
        model: { type: string }
        content:
          type: array
          items: { type: object, additionalProperties: true }
        usage:
          type: object
          properties:
            input_tokens: { type: integer }
            output_tokens: { type: integer }
          additionalProperties: true
      additionalProperties: true

    ClaudeEmbeddingsRequest:
      type: object
      required: [input]
      properties:
        model: { type: string }
        input:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        metadata:
          type: object
          additionalProperties: true
      additionalProperties: true

    ClaudeEmbeddingsResponse:
      type: object
      properties:
        model: { type: string }
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        usage:
          type: object
          properties:
            input_tokens: { type: integer }
            output_tokens: { type: integer }
            total_tokens: { type: integer }
          additionalProperties: true
      additionalProperties: true

    ClaudeRerankRequest:
      type: object
      required: [query, documents]
      properties:
        model: { type: string }
        query: { type: string }
        documents:
          type: array
          minItems: 1
          items:
            oneOf:
              - type: string
              - type: object
                additionalProperties: true
        top_n: { type: integer, minimum: 1 }
        return_documents: { type: boolean, default: false }
        metadata:
          type: object
          additionalProperties: true
      additionalProperties: true

    ClaudeRerankResponse:
      type: object
      properties:
        id: { type: string }
        model: { type: string }
        results:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              relevance_score: { type: number }
              document:
                nullable: true
                oneOf:
                  - type: string
                  - type: object
                    additionalProperties: true
        usage:
          type: object
          properties:
            input_tokens: { type: integer }
            output_tokens: { type: integer }
            total_tokens: { type: integer }
          additionalProperties: true
      additionalProperties: true

    ClaudeOcrResponse:
      type: object
      properties:
        request_id: { type: string }
        file_id: { type: integer }
        text: { type: string }
        pages:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true

    JobCreateRequest:
      type: object
      required: [job_type]
      properties:
        job_type:
          type: string
          enum: [CHAT, EMBEDDING, RERANK, VL, OCR, EMBEDDING_BATCH]
        model: { type: string }
        file_ids:
          type: array
          items: { type: integer }
        input:
          type: object
          additionalProperties: true
        callback_url:
          type: string
          format: uri
          nullable: true
        priority:
          type: string
          enum: [LOW, NORMAL, HIGH]
          default: NORMAL
        metadata:
          type: object
          additionalProperties: true
      additionalProperties: true

    JobCreateResponse:
      type: object
      properties:
        job_id: { type: string }
        status: { type: string }
      additionalProperties: true

    JobGetResponse:
      type: object
      properties:
        job_id: { type: string }
        job_type: { type: string }
        status: { type: string }
        result:
          type: object
          additionalProperties: true
        error_code: { type: string }
        error_message: { type: string }
      additionalProperties: true

    ClaudeError:
      type: object
      properties:
        type: { type: string }
        error:
          type: object
          properties:
            type: { type: string }
            message: { type: string }
          required: [message]
      additionalProperties: true
